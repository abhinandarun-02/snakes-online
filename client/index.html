<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
        
    <!-- Game Stats -->
    <div id="gameStats">
        <div class="stat-item">
            <span class="stat-label">FPS:</span>
            <span id="fpsCounter">60</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Ping:</span>
            <span id="pingCounter">0ms</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Online:</span>
            <span id="playersOnline">0</span>
        </div>
    </div>
    
    <!-- Lobby Screen -->
    <div id="lobbyScreen">
        <div class="lobby-container">
            <h1 class="lobby-title">Welcome to <span class="highlight">Snake</span></h1>
            <p class="welcome-text" id="welcomeText"></p>
            
            <div class="create-room-section">
                <input type="text" id="roomNameInput" placeholder="Enter room name..." maxlength="20">
                <button id="createRoomBtn">Create Room</button>
            </div>

            <div class="rooms-section">
                <h2>Available Rooms</h2>
                <div id="roomsList"></div>
            </div>
            
            <button id="changeNameBtn" class="change-name-btn">Change name</button>
        </div>
    </div>

    <!-- Room Screen -->
    <div id="roomScreen" style="display: none;">
        <div class="room-info">
            <div class="room-header">
                <h2 id="currentRoomName"></h2>
                <button id="leaveRoomBtn">Leave Room</button>
            </div>
            
            <!-- Game Configuration Display -->
            <div id="gameConfigDisplay" class="game-config-display"></div>
            
            <!-- Room Configuration Editor (for admin) -->
            <div id="roomConfigEditor" class="room-config-panel" style="display: none;">
                <h3 class="config-title">Edit Game Settings</h3>
                
                <div class="config-grid">
                    <div class="config-item">
                        <label>Game Mode</label>
                        <select id="editGameModeSelect" class="config-select">
                            <option value="timed">Timed - Race against the clock</option>
                            <option value="points">Points - First to reach target</option>
                            <option value="survival">Survival - Last snake standing</option>
                            <option value="endless">Endless - No limits</option>
                            <option value="battle_royale">Battle Royale - Shrinking arena</option>
                        </select>
                    </div>

                    <div class="config-item" id="editTimeLimitConfig">
                        <label>Time Limit</label>
                        <select id="editTimeLimitSelect" class="config-select">
                            <option value="30">30 seconds</option>
                            <option value="60">1 minute</option>
                            <option value="90">1.5 minutes</option>
                            <option value="120">2 minutes</option>
                            <option value="180">3 minutes</option>
                            <option value="300">5 minutes</option>
                        </select>
                    </div>

                    <div class="config-item" id="editPointLimitConfig" style="display: none;">
                        <label>Point Limit</label>
                        <select id="editPointLimitSelect" class="config-select">
                            <option value="10">10 points</option>
                            <option value="25">25 points</option>
                            <option value="50">50 points</option>
                            <option value="75">75 points</option>
                            <option value="100">100 points</option>
                        </select>
                    </div>

                    <div class="config-item">
                        <label>Max Players</label>
                        <select id="editMaxPlayersSelect" class="config-select">
                            <option value="2">2 players</option>
                            <option value="3">3 players</option>
                            <option value="4">4 players</option>
                            <option value="6">6 players</option>
                            <option value="8">8 players</option>
                        </select>
                    </div>

                    <div class="config-item">
                        <label>Speed</label>
                        <select id="editSpeedSelect" class="config-select">
                            <option value="SLOW">Slow</option>
                            <option value="NORMAL">Normal</option>
                            <option value="FAST">Fast</option>
                            <option value="TURBO">Turbo</option>
                        </select>
                    </div>

                    <div class="config-item">
                        <label>Difficulty</label>
                        <select id="editDifficultySelect" class="config-select">
                            <option value="EASY">Easy</option>
                            <option value="NORMAL">Normal</option>
                            <option value="HARD">Hard</option>
                        </select>
                    </div>

                    <div class="config-item full-width">
                        <div style="display: flex; gap: 8px;">
                            <button id="saveConfigBtn" class="save-config-btn">Save Changes</button>
                            <button id="cancelConfigBtn" class="cancel-config-btn">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="playersList"></div>
            <button id="deleteRoomBtn" style="display: none;">Delete Room</button>
        </div>
    </div>

    <!-- Chat Panel (Left Side) -->
    <div id="chatPanel" class="chat-panel-left" style="display: none;">
        <div class="chat-header">
            <h3 class="chat-title">Room Chat</h3>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form" autocomplete="off">
            <input type="text" id="chatInput" placeholder="Type a message..." maxlength="300" autocomplete="off">
            <button type="submit" id="chatSendBtn">Send</button>
        </form>
    </div>

    <!-- Game UI -->
    <div id="ui" style="display: none;">
        <div id="countdown"></div>
        <button id="readyBtn">Ready</button>
    </div>
    
    <div id="gameOverScreen"></div>
    <canvas id="gameCanvas" width="800" height="600" style="display: none;"></canvas>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="module">
        import { Game } from './game.js';

        // Random name generator
        function generateRandomName() {
            const adjectives = ['Swift', 'Cunning', 'Brave', 'Mighty', 'Quick', 'Silent', 'Fierce', 'Wild', 'Bold', 'Smart'];
            const nouns = ['Viper', 'Cobra', 'Python', 'Mamba', 'Rattler', 'Serpent', 'Adder', 'Anaconda', 'Boa', 'Snake'];
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            return `${adj}${noun}`;
        }

        // Get player name from localStorage if available, otherwise prompt and store
        let playerName = localStorage.getItem('playerName') || '';
        if (playerName) {
            playerName = String(playerName).trim();
            if (playerName.length > 15) playerName = playerName.substring(0, 15);
        } else {
            let input = prompt("Welcome to Snake Game! 🐍\n\nPlease enter your name:") || "";
            input = input.trim();
            // If user didn't provide a name, generate a random one
            if (!input) input = generateRandomName();
            playerName = input.substring(0, 15);
            // store for future visits
            try { localStorage.setItem('playerName', playerName); } catch (e) { /* ignore storage errors */ }
        }

        const socket = io();
        const canvas = document.getElementById("gameCanvas");
        const readyBtn = document.getElementById("readyBtn");
        const countdownEl = document.getElementById("countdown");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const gameStats = document.getElementById("gameStats");
        const fpsCounter = document.getElementById("fpsCounter");
        const pingCounter = document.getElementById("pingCounter");
        const playersOnline = document.getElementById("playersOnline");

        // UI Elements
        const lobbyScreen = document.getElementById("lobbyScreen");
        const roomScreen = document.getElementById("roomScreen");
        const gameUI = document.getElementById("ui");
        const roomNameInput = document.getElementById("roomNameInput");
        const createRoomBtn = document.getElementById("createRoomBtn");
        const roomsList = document.getElementById("roomsList");
        const currentRoomName = document.getElementById("currentRoomName");
        const playersList = document.getElementById("playersList");
        const leaveRoomBtn = document.getElementById("leaveRoomBtn");
        const deleteRoomBtn = document.getElementById("deleteRoomBtn");
        const changeNameBtn = document.getElementById("changeNameBtn");
        const roomConfigPanel = document.getElementById("roomConfigPanel");
        const gameConfigDisplay = document.getElementById("gameConfigDisplay");
        const roomConfigEditor = document.getElementById("roomConfigEditor");
        const saveConfigBtn = document.getElementById("saveConfigBtn");
        const cancelConfigBtn = document.getElementById("cancelConfigBtn");
        const chatMessages = document.getElementById("chatMessages");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const chatPanel = document.getElementById("chatPanel");
        
        // Edit configuration inputs
        const editGameModeSelect = document.getElementById("editGameModeSelect");
        const editTimeLimitSelect = document.getElementById("editTimeLimitSelect");
        const editPointLimitSelect = document.getElementById("editPointLimitSelect");
        const editMaxPlayersSelect = document.getElementById("editMaxPlayersSelect");
        const editSpeedSelect = document.getElementById("editSpeedSelect");
        const editDifficultySelect = document.getElementById("editDifficultySelect");
        const editTimeLimitConfig = document.getElementById("editTimeLimitConfig");
        const editPointLimitConfig = document.getElementById("editPointLimitConfig");

        let game = null;
        let currentRoom = null;

        // FPS counter
        let lastFrameTime = Date.now();
        let frameCount = 0;
        let fps = 60;

        function updateFPS() {
            frameCount++;
            const currentTime = Date.now();
            if (currentTime - lastFrameTime >= 1000) {
                fps = frameCount;
                fpsCounter.textContent = fps;
                frameCount = 0;
                lastFrameTime = currentTime;
            }
            requestAnimationFrame(updateFPS);
        }

        // Ping measurement
        let lastPingTime = 0;
        let pingInterval = null;
        function measurePing() {
            const startTime = Date.now();
            socket.emit("ping", startTime);
        }

        socket.on("pong", (startTime) => {
            const ping = Date.now() - startTime;
            pingCounter.textContent = `${ping}ms`;
        });

        // Players online counter
        socket.on("playersOnlineCount", (count) => {
            playersOnline.textContent = count;
        });

        // Wait for socket connection before starting ping measurement
        socket.on("connect", () => {
            // Clear any existing interval
            if (pingInterval) clearInterval(pingInterval);
            // Measure ping immediately
            measurePing();
            // Then measure every 2 seconds
            pingInterval = setInterval(measurePing, 2000);
        });

        socket.on("disconnect", () => {
            // Clear ping interval on disconnect
            if (pingInterval) {
                clearInterval(pingInterval);
                pingInterval = null;
            }
            pingCounter.textContent = "---";
        });

        // Start FPS counter immediately
        requestAnimationFrame(updateFPS);

        // Send player name to server
        socket.emit("setPlayerName", playerName);
        
        // Display welcome message
        const welcomeText = document.getElementById("welcomeText");
        welcomeText.textContent = `Welcome, ${playerName}!`;

        // Edit mode change handler
        editGameModeSelect.addEventListener("change", () => {
            const mode = editGameModeSelect.value;
            updateModeVisibility(mode, editTimeLimitConfig, editPointLimitConfig);
        });

        function updateModeVisibility(mode, timeLimitEl, pointLimitEl) {
            // Show/hide time limit based on mode
            if (mode === "timed" || mode === "battle_royale") {
                timeLimitEl.style.display = "block";
                pointLimitEl.style.display = "none";
            } else if (mode === "points") {
                timeLimitEl.style.display = "none";
                pointLimitEl.style.display = "block";
            } else {
                timeLimitEl.style.display = "none";
                pointLimitEl.style.display = "none";
            }
        }

        function clearChatMessages() {
            if (chatMessages) {
                chatMessages.innerHTML = "";
            }
            if (chatInput) {
                chatInput.value = "";
            }
        }

        function formatChatTime(timestamp) {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            if (Number.isNaN(date.getTime())) {
                return "";
            }
            return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function appendChatMessage(message) {
            if (!chatMessages || !message) return;

            const messageEl = document.createElement("div");
            messageEl.className = "chat-message";
            
            // Handle system messages
            if (message.type === 'system') {
                messageEl.classList.add("system");
                
                const contentSpan = document.createElement("span");
                contentSpan.className = "chat-content";
                contentSpan.textContent = message.content || "";
                
                messageEl.appendChild(contentSpan);
                chatMessages.appendChild(messageEl);
                return;
            }
            
            // Handle user messages
            const isSelf = message.senderId === socket.id;
            if (isSelf) {
                messageEl.classList.add("me");
            }

            const authorSpan = document.createElement("span");
            authorSpan.className = "chat-author";
            const senderName = message.senderName || "Player";
            const displayName = isSelf ? `${senderName} (You)` : senderName;
            authorSpan.textContent = displayName;

            const contentSpan = document.createElement("span");
            contentSpan.className = "chat-content";
            contentSpan.textContent = message.content || "";

            const timestampSpan = document.createElement("span");
            timestampSpan.className = "chat-timestamp";
            timestampSpan.textContent = formatChatTime(message.timestamp);

            messageEl.appendChild(authorSpan);
            messageEl.appendChild(contentSpan);
            if (timestampSpan.textContent) {
                messageEl.appendChild(timestampSpan);
            }

            chatMessages.appendChild(messageEl);
        }

        function scrollChatToBottom(force = false) {
            if (!chatMessages) return;
            const distanceFromBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            if (force || distanceFromBottom < 40) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        if (chatForm) {
            chatForm.addEventListener("submit", (event) => {
                event.preventDefault();
                if (!currentRoom) return;
                const message = chatInput.value.trim();
                if (!message) return;
                socket.emit("sendChatMessage", message);
                chatInput.value = "";
            });
        }

        // Change name button handler
        changeNameBtn.addEventListener("click", () => {
            const newName = prompt("Enter your new name:") || "";
            const trimmedName = newName.trim();
            
            if (trimmedName) {
                playerName = trimmedName.length > 15 ? trimmedName.substring(0, 15) : trimmedName;
            } else if (newName !== "") {
                // If user entered empty string explicitly, generate random name
                playerName = generateRandomName();
            } else {
                // User cancelled prompt (newName === "" and trimmedName === "") -> do nothing
                return;
            }

            // Persist and notify server
            try { localStorage.setItem('playerName', playerName); } catch (e) { /* ignore */ }
            socket.emit("setPlayerName", playerName);
            welcomeText.textContent = `Welcome, ${playerName}!`;
        });

        // ===== LOBBY HANDLERS =====
        createRoomBtn.addEventListener("click", () => {
            const roomName = roomNameInput.value.trim();
            if (roomName) {
                const config = {
                    name: roomName,
                    gameMode: 'timed',
                    timeLimit: 60,
                    pointLimit: 25,
                    maxPlayers: 4,
                    speed: 'NORMAL',
                    difficulty: 'NORMAL',
                    isPublic: true
                };
                
                socket.emit("createRoom", config);
                roomNameInput.value = "";
            }
        });

        roomNameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                createRoomBtn.click();
            }
        });

        function joinRoom(roomId) {
            socket.emit("joinRoom", roomId);
        }

        leaveRoomBtn.addEventListener("click", () => {
            socket.emit("leaveRoom");
        });

        deleteRoomBtn.addEventListener("click", () => {
            if (confirm("Are you sure you want to delete this room?")) {
                socket.emit("deleteRoom");
            }
        });

        // Save config button handler
        saveConfigBtn.addEventListener("click", () => {
            const newConfig = {
                gameMode: editGameModeSelect.value,
                timeLimit: parseInt(editTimeLimitSelect.value),
                pointLimit: parseInt(editPointLimitSelect.value),
                maxPlayers: parseInt(editMaxPlayersSelect.value),
                speed: editSpeedSelect.value,
                difficulty: editDifficultySelect.value,
                isPublic: currentRoom.config.isPublic
            };
            
            socket.emit("updateRoomConfig", newConfig);
            
            // Hide editor, show display
            roomConfigEditor.style.display = "none";
            gameConfigDisplay.style.display = "block";
        });

        // Cancel config button handler
        cancelConfigBtn.addEventListener("click", () => {
            roomConfigEditor.style.display = "none";
            gameConfigDisplay.style.display = "block";
        });

        // Ready button handler
        readyBtn.addEventListener("click", () => {
            gameOverScreen.style.display = "none";
            socket.emit("playerReady");
            readyBtn.disabled = true;
        });

        // ===== ROOM SOCKET LISTENERS =====
        socket.on("roomsList", (rooms) => {
            renderRoomsList(rooms);
        });

        socket.on("chatHistory", (messages) => {
            if (!Array.isArray(messages) || !currentRoom) return;
            clearChatMessages();
            messages.forEach(appendChatMessage);
            scrollChatToBottom(true);
        });

        socket.on("chatMessage", ({ roomId, message }) => {
            if (!currentRoom || !message || currentRoom.id !== roomId) return;
            appendChatMessage(message);
            scrollChatToBottom();
        });

        socket.on("joinedRoom", (room) => {
            currentRoom = room;
            showRoomScreen(room);
            if (!game) {
                game = new Game(canvas, socket);
            }
        });

        socket.on("roomUpdate", (room) => {
            currentRoom = room;
            updateRoomScreen(room);
            
            // Show notification if config was updated
            if (roomConfigEditor.style.display === "block" || gameConfigDisplay.style.display === "none") {
                // Config was being edited, close editor
                roomConfigEditor.style.display = "none";
                gameConfigDisplay.style.display = "block";
            }
        });

        socket.on("leftRoom", () => {
            currentRoom = null;
            showLobbyScreen();
        });

        socket.on("error", (message) => {
            alert(message);
        });

        // ===== RENDER FUNCTIONS =====
        function renderRoomsList(rooms) {
            roomsList.innerHTML = "";
            
            if (rooms.length === 0) {
                roomsList.innerHTML = '<p class="no-rooms">No rooms available. Create one!</p>';
                return;
            }

            rooms.forEach(room => {
                const roomCard = document.createElement("div");
                roomCard.className = "room-card";
                roomCard.innerHTML = `
                    <div class="room-card-info">
                        <h3>${room.name}</h3>
                        <p class="room-mode">${room.gameMode}</p>
                        <p class="room-players">${room.playerCount}/${room.maxPlayers} players</p>
                    </div>
                    <button class="join-btn" onclick="window.joinRoom('${room.id}')">Join</button>
                `;
                roomsList.appendChild(roomCard);
            });
        }

        function showRoomScreen(room) {
            lobbyScreen.style.display = "none";
            roomScreen.style.display = "block";
            chatPanel.style.display = "flex";
            gameUI.style.display = "flex";
            canvas.style.display = "block";
            clearChatMessages();
            updateRoomScreen(room);
            if (chatInput) {
                setTimeout(() => chatInput.focus(), 50);
            }
        }

        function showLobbyScreen() {
            lobbyScreen.style.display = "flex";
            roomScreen.style.display = "none";
            chatPanel.style.display = "none";
            gameUI.style.display = "none";
            canvas.style.display = "none";
            gameOverScreen.style.display = "none";
            readyBtn.style.display = "inline-block";
            readyBtn.disabled = false;
            clearChatMessages();
        }

        function updateRoomScreen(room) {
            currentRoomName.textContent = room.name;
            
            // Show delete button only for admin
            if (room.admin === socket.id) {
                deleteRoomBtn.style.display = "block";
            } else {
                deleteRoomBtn.style.display = "none";
            }

            // Hide editor if it was open
            roomConfigEditor.style.display = "none";
            gameConfigDisplay.style.display = "block";

            // Display game configuration
            const config = room.config;
            const gameModeNames = {
                'timed': 'Timed',
                'points': 'Points',
                'survival': 'Survival',
                'endless': 'Endless',
                'battle_royale': 'Battle Royale'
            };
            
            let configHTML = `
                <div class="config-display-grid">
                    <div class="config-display-item">
                        <span class="config-label">Mode:</span>
                        <span class="config-value">${gameModeNames[config.gameMode] || config.gameMode}</span>
                    </div>
                    <div class="config-display-item">
                        <span class="config-label">Players:</span>
                        <span class="config-value">${room.players.length}/${config.maxPlayers}</span>
                    </div>
            `;
            
            if (config.gameMode === 'timed' || config.gameMode === 'battle_royale') {
                configHTML += `
                    <div class="config-display-item">
                        <span class="config-label">Time:</span>
                        <span class="config-value">${config.timeLimit}s</span>
                    </div>
                `;
            }
            
            if (config.gameMode === 'points') {
                configHTML += `
                    <div class="config-display-item">
                        <span class="config-label">Target:</span>
                        <span class="config-value">${config.pointLimit} points</span>
                    </div>
                `;
            }
            
            configHTML += `
                    <div class="config-display-item">
                        <span class="config-label">Speed:</span>
                        <span class="config-value">${config.speed}</span>
                    </div>
                    <div class="config-display-item">
                        <span class="config-label">Difficulty:</span>
                        <span class="config-value">${config.difficulty}</span>
                    </div>
                </div>
            `;
            
            gameConfigDisplay.innerHTML = configHTML;
            
            // Add edit button for admin (only if game hasn't started)
            const gameStarted = room.gameState && room.gameState.gameStarted;
            if (room.admin === socket.id && !gameStarted) {
                const editBtn = document.createElement('button');
                editBtn.className = 'edit-config-btn';
                editBtn.textContent = 'Edit Settings';
                editBtn.addEventListener('click', () => {
                    const config = currentRoom.config;
                    editGameModeSelect.value = config.gameMode;
                    editTimeLimitSelect.value = config.timeLimit;
                    editPointLimitSelect.value = config.pointLimit;
                    editMaxPlayersSelect.value = config.maxPlayers;
                    editSpeedSelect.value = config.speed;
                    editDifficultySelect.value = config.difficulty;
                    
                    updateModeVisibility(config.gameMode, editTimeLimitConfig, editPointLimitConfig);
                    
                    gameConfigDisplay.style.display = "none";
                    roomConfigEditor.style.display = "block";
                });
                gameConfigDisplay.appendChild(editBtn);
            }

            // Render players list
            playersList.innerHTML = "";
            room.players.forEach(player => {
                const playerItem = document.createElement("div");
                playerItem.className = "player-item";
                const isAdmin = player.id === room.admin;
                const isYou = player.id === socket.id;
                const displayName = isYou ? `${player.name} (You)` : player.name;
                const adminBadge = isAdmin ? '<span class="admin-badge">Admin</span>' : '';
                const readyBadge = player.ready ? '<span class="ready-badge">Ready</span>' : '';
                playerItem.innerHTML = `
                    <span class="player-name">${displayName}</span>
                    ${adminBadge}
                    ${readyBadge}
                `;
                playersList.appendChild(playerItem);
            });
        }

        // Make joinRoom available globally
        window.joinRoom = joinRoom;

        // Socket event listeners for UI updates
        socket.on("countdown", (seconds) => {
            countdownEl.textContent = `Game starts in: ${seconds}`;
        });

        socket.on("gameStart", () => {
            countdownEl.textContent = "Go!";
            setTimeout(() => countdownEl.textContent = "", 1000);
            readyBtn.style.display = "none";
        });

        socket.on("timerUpdate", (timeLeft) => {
            countdownEl.textContent = `Time left: ${timeLeft}s`;
        });

        socket.on("gameOver", (scores) => {
            gameOverScreen.style.display = "block";

            const me = scores.find(s => s.id === socket.id);
            
            let resultText = "GAME OVER";
            if (me && me.isWinner) {
                resultText = "YOU WIN!";
            } else if (me && scores.length > 1) {
                resultText = "GAME OVER";
            }

            let scoresHTML = '<div class="scores-list">';
            scores.forEach((score, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                const isMe = score.id === socket.id;
                scoresHTML += `
                    <div class="score-item ${isMe ? 'highlight-me' : ''}">
                        <span>${medal} ${score.name}${isMe ? ' (You)' : ''}</span>
                        <span>${score.score} pts</span>
                    </div>
                `;
            });
            scoresHTML += '</div>';

            gameOverScreen.innerHTML = `
                <h1>${resultText}</h1>
                ${me ? `<p class="my-score">Your score: ${me.score}</p>` : ""}
                ${scoresHTML}
            `;
            
            readyBtn.style.display = "inline-block";
            readyBtn.disabled = false;
        });
    </script>
</body>
</html>
